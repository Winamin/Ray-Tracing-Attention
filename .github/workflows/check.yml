name: Source and packaging
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[compiler,dev]'
      - run: python -m compileall -q ray_tracing
      - run: rt-compile --help
      - run: rt-build --help
      - run: rt-chat --help
      - run: python -m build
